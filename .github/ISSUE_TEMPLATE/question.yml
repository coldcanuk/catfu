name: Question
description: Ask about usage, design, or contribution workflow
title: "question: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer docs first: [README](https://github.com/coldcanuk/catfu/blob/main/README.md), [CONTRIBUTING](https://github.com/coldcanuk/catfu/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Be specific. Include what you already tried.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Commands, config (redacted), and goal.
    validations:
      required: false
