name: Feature request
description: Propose a new capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Drive-by feature dumps without motivation may be closed.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should catfu behave? CLI flags, MCP tools, output shape, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or existing flags you tried.
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - CLI
        - MCP server
        - Catalogue / yt-dlp integration
        - Search / FTS / Brave backend
        - Storage / schema
        - Docs / DX
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues/PRs for a similar request
          required: true
        - label: This is not a demand for bulk automated dependency churn
          required: true
